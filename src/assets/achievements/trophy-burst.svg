<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="burst-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stopColor="#F59E0B" stopOpacity="0.4" />
      <stop offset="70%" stopColor="#F59E0B" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#F59E0B" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="gold-cup-outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="40%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    <linearGradient id="gold-cup-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#78350F" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    <linearGradient id="plinth-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="50%" stopColor="#334155" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <filter id="trophy-ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Golden Aura Backing -->
  <circle cx="60" cy="55" r="50" fill="url(#burst-glow)" />

  <!-- Radial Celebratory Light Rays -->
  <g class="celebration-rays" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
    <line x1="60" y1="8" x2="60" y2="16" />
    <line x1="93" y1="22" x2="87" y2="28" />
    <line x1="107" y1="55" x2="99" y2="55" />
    <line x1="93" y1="88" x2="87" y2="82" />
    <line x1="27" y1="22" x2="33" y2="28" />
    <line x1="13" y1="55" x2="21" y2="55" />
    <line x1="27" y1="88" x2="33" y2="82" />
  </g>

  <!-- Celebratory Sparkle Stars -->
  <g class="celebration-sparkles" fill="#FDE68A">
    <!-- Star 1 -->
    <path d="M 92 32 Q 95 35 98 35 Q 95 35 95 38 Q 95 35 92 35 Q 95 35 92 32 Z" />
    <!-- Star 2 -->
    <path d="M 28 36 Q 31 39 34 39 Q 31 39 31 42 Q 31 39 28 39 Q 31 39 28 36 Z" />
    <!-- Star 3 -->
    <path d="M 75 16 Q 77 18 79 18 Q 77 18 77 20 Q 77 18 75 18 Q 77 18 75 16 Z" />
  </g>

  <!-- Trophy Rig -->
  <g filter="url(#trophy-ambient)">
    <!-- Stepped Marble Plinth / Base -->
    <path d="M 44 94 L 76 94 L 78 102 L 42 102 Z" fill="url(#plinth-grad)" stroke="#475569" stroke-width="1" />
    <rect x="40" y="102" width="40" height="6" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- Golden Plaque on Plinth -->
    <rect x="52" y="96" width="16" height="4" rx="1" fill="#F59E0B" />

    <!-- Stem Column & Pedestal Fluting -->
    <path d="M 54 82 L 66 82 L 64 94 L 56 94 Z" fill="url(#gold-cup-outer)" stroke="#B45309" stroke-width="1" />
    <ellipse cx="60" cy="82" rx="7" ry="2" fill="#FDE68A" />

    <!-- Trophy Handles (Sweeping Geometric Arcs) -->
    <!-- Left Handle -->
    <path d="M 44 42 C 26 42, 24 64, 46 66 L 47 62 C 32 60, 33 46, 45 46 Z" fill="url(#gold-cup-outer)" stroke="#92400E" stroke-width="0.8" />
    <!-- Right Handle -->
    <path d="M 76 42 C 94 42, 96 64, 74 66 L 73 62 C 88 60, 87 46, 75 46 Z" fill="url(#gold-cup-outer)" stroke="#92400E" stroke-width="0.8" />

    <!-- Main Trophy Bowl -->
    <!-- Bowl Interior Cavity -->
    <ellipse cx="60" cy="38" rx="22" ry="5.5" fill="url(#gold-cup-inner)" stroke="#92400E" stroke-width="1" />
    <!-- Bowl Outer Chalice -->
    <path d="M 38 38 C 38 64, 48 80, 60 80 C 72 80, 82 64, 82 38 Z" fill="url(#gold-cup-outer)" stroke="#92400E" stroke-width="1" />

    <!-- Specular Highlight Crest -->
    <path d="M 43 42 C 45 58, 52 70, 60 74 C 55 68, 48 56, 47 42 Z" fill="#FEF3C7" opacity="0.45" />

    <!-- Central Milestone Emblem (Star in relief) -->
    <polygon points="60,48 62.5,54 68.5,54.5 64,58.5 65.5,64.5 60,61 54.5,64.5 56,58.5 51.5,54.5 57.5,54" fill="#FEF3C7" stroke="#B45309" stroke-width="0.8" />
  </g>
</svg>
