<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <radialGradient id="radar-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.25" />
      <stop offset="60%" stopColor="#10B981" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#10B981" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="sweep-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#34D399" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#059669" stopOpacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Radar Dish Background Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#radar-core-glow)" />

  <!-- Concentric Range Rings -->
  <g class="radar-rings" stroke="#059669" stroke-linecap="round" opacity="0.45">
    <circle cx="100" cy="100" r="88" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle cx="100" cy="100" r="66" stroke-width="1" />
    <circle cx="100" cy="100" r="44" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="100" cy="100" r="22" stroke-width="1" />
  </g>

  <!-- Crosshair Reticle Axes -->
  <g class="radar-crosshairs" stroke="#10B981" stroke-width="1" opacity="0.4">
    <line x1="100" y1="8" x2="100" y2="192" stroke-dasharray="3 3" />
    <line x1="8" y1="100" x2="192" y2="100" stroke-dasharray="3 3" />
    <!-- 4 Cardinal Tick Markers -->
    <line x1="100" y1="8" x2="100" y2="16" stroke-width="2" />
    <line x1="100" y1="184" x2="100" y2="192" stroke-width="2" />
    <line x1="8" y1="100" x2="16" y2="100" stroke-width="2" />
    <line x1="184" y1="100" x2="192" y2="100" stroke-width="2" />
  </g>

  <!-- Corner Alignment Brackets -->
  <g class="radar-brackets" stroke="#34D399" stroke-width="1.8" stroke-linecap="square" opacity="0.7">
    <path d="M 28 42 L 28 28 L 42 28" />
    <path d="M 172 42 L 172 28 L 158 28" />
    <path d="M 28 158 L 28 172 L 42 172" />
    <path d="M 172 158 L 172 172 L 158 172" />
  </g>

  <!-- Telemetry Blip Coordinates -->
  <g class="radar-blips">
    <!-- Blip 1: Companion Phone Signal Lock -->
    <circle cx="138" cy="62" r="3.5" fill="#34D399" />
    <circle cx="138" cy="62" r="7" stroke="#34D399" stroke-width="1" opacity="0.6" />
    <!-- Blip 2: Session Data Beacon -->
    <circle cx="68" cy="132" r="2.5" fill="#F59E0B" />
  </g>

  <!-- Radar Center Hub -->
  <circle cx="100" cy="100" r="4" fill="#10B981" stroke="#047857" stroke-width="1" />
  <circle cx="100" cy="100" r="1.5" fill="#ECFDF5" />
</svg>
