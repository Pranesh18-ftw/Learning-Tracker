<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <radialGradient id="brass-grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="60%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#78350F" />
    </radialGradient>
    <radialGradient id="steel-grad" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stopColor="#E2E8F0" />
      <stop offset="50%" stopColor="#94A3B8" />
      <stop offset="100%" stopColor="#334155" />
    </radialGradient>
    <filter id="gear-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Escapement Wheel (15 Club Teeth) -->
  <g class="horology-escape-wheel" filter="url(#gear-shadow)">
    <!-- Wheel Rim & Spokes -->
    <circle cx="80" cy="80" r="42" stroke="url(#brass-grad)" stroke-width="2.5" />
    <circle cx="80" cy="80" r="16" fill="url(#steel-grad)" stroke="#1E293B" stroke-width="1.5" />
    <!-- 4 Cross Spokes -->
    <line x1="80" y1="38" x2="80" y2="64" stroke="url(#brass-grad)" stroke-width="2" stroke-linecap="round" />
    <line x1="80" y1="96" x2="80" y2="122" stroke="url(#brass-grad)" stroke-width="2" stroke-linecap="round" />
    <line x1="38" y1="80" x2="64" y2="80" stroke="url(#brass-grad)" stroke-width="2" stroke-linecap="round" />
    <line x1="96" y1="80" x2="122" y2="80" stroke="url(#brass-grad)" stroke-width="2" stroke-linecap="round" />

    <!-- 12 Club Teeth around perimeter -->
    <path d="
      M 80 34 L 83 25 L 87 27 L 85 35
      M 103 40 L 110 33 L 114 36 L 109 43
      M 120 57 L 128 53 L 131 58 L 124 63
      M 126 80 L 135 80 L 136 85 L 126 84
      M 120 103 L 128 107 L 126 112 L 117 107
      M 103 120 L 109 127 L 105 131 L 99 123
      M 80 126 L 81 135 L 76 135 L 77 126
      M 57 120 L 51 127 L 47 123 L 53 117
      M 40 103 L 32 107 L 30 102 L 38 98
      M 34 80 L 25 80 L 25 75 L 34 76
      M 40 57 L 33 50 L 37 47 L 44 53
      M 57 40 L 52 32 L 57 29 L 63 37
    " fill="url(#brass-grad)" stroke="#92400E" stroke-width="0.8" />
  </g>

  <!-- Oscillating Balance Spring (Archimedean Hairspring Spiral) -->
  <g class="horology-balance-spring" opacity="0.85">
    <path d="
      M 80 80
      A 2.5 2.5 0 0 1 82.5 77.5
      A 5 5 0 0 1 85 82.5
      A 7.5 7.5 0 0 1 77.5 87.5
      A 10 10 0 0 1 70 80
      A 13 13 0 0 1 80 67
      A 16 16 0 0 1 96 80
      A 20 20 0 0 1 80 100
      A 24 24 0 0 1 56 80
      A 28 28 0 0 1 80 52
    " fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Center Jewel Bearing (Ruby Cabochon) -->
  <circle cx="80" cy="80" r="5" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
  <circle cx="78.5" cy="78.5" r="1.5" fill="#FECACA" opacity="0.8" />
</svg>
