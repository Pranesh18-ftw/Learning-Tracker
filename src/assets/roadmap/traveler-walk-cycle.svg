<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="48" height="56" fill="none">
  <defs>
    <linearGradient id="suit-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="visor-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#FCD34D" />
    </linearGradient>
    <filter id="traveler-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="24" cy="51" rx="12" ry="3.5" fill="#0F172A" opacity="0.35" />

  <g class="traveler-rig" filter="url(#traveler-shadow)">
    <!-- Back Arm -->
    <g class="limb-back-arm" style="transform-origin: 20px 22px;">
      <line x1="20" y1="22" x2="14" y2="30" stroke="#0369A1" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="30" x2="10" y2="36" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="10" cy="36" r="2" fill="#D97706" />
    </g>

    <!-- Back Leg -->
    <g class="limb-back-leg" style="transform-origin: 22px 34px;">
      <line x1="22" y1="34" x2="16" y2="42" stroke="#075985" stroke-width="3.5" stroke-linecap="round" />
      <line x1="16" y1="42" x2="12" y2="49" stroke="#0369A1" stroke-width="3" stroke-linecap="round" />
      <path d="M 10 49 L 14 49 L 15 51 L 9 51 Z" fill="#D97706" />
    </g>

    <!-- Torso & Life Support Pack -->
    <g class="traveler-torso">
      <!-- Backpack battery pack -->
      <rect x="12" y="19" width="6" height="12" rx="2" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
      <circle cx="15" cy="22" r="1" fill="#10B981" />
      <circle cx="15" cy="26" r="1" fill="#38BDF8" />

      <!-- Main Body Core -->
      <path d="M 18 18 Q 24 16 30 18 L 29 32 Q 24 34 19 32 Z" fill="url(#suit-grad)" stroke="#E0F2FE" stroke-width="1" />
      <!-- Chest Specular Accent -->
      <line x1="22" y1="20" x2="26" y2="20" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Front Leg -->
    <g class="limb-front-leg" style="transform-origin: 26px 34px;">
      <line x1="26" y1="34" x2="31" y2="42" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" />
      <line x1="31" y1="42" x2="35" y2="49" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <path d="M 33 49 L 38 49 L 39 51 L 32 51 Z" fill="#F59E0B" />
    </g>

    <!-- Explorer Helmet & Illuminated Visor -->
    <g class="traveler-head">
      <circle cx="25" cy="11" r="7.5" fill="#0C4A6E" stroke="#7DD3FC" stroke-width="1.2" />
      <!-- Golden Panorama Visor -->
      <path d="M 23 8 Q 30 8 31 12 Q 29 15 23 15 Q 21 12 23 8 Z" fill="url(#visor-grad)" />
      <!-- Antenna with Signal Beacon -->
      <line x1="22" y1="4" x2="22" y2="1" stroke="#94A3B8" stroke-width="1" />
      <circle cx="22" cy="1" r="1.5" fill="#F43F5E" />
    </g>

    <!-- Front Arm -->
    <g class="limb-front-arm" style="transform-origin: 27px 22px;">
      <line x1="27" y1="22" x2="33" y2="29" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="33" y1="29" x2="38" y2="35" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="38" cy="35" r="2" fill="#F59E0B" />
    </g>
  </g>
</svg>
