<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="spatial-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" result="desat" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.8" />
        <feFuncG type="linear" slope="0.8" />
        <feFuncB type="linear" slope="0.8" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#spatial-noise)" fill="#808080" />
</svg>
